[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photosortx"
version = "2.3.0"
description = "AIを活用した高機能な画像整理・管理アプリケーション"
requires-python = ">=3.10"
dependencies = [
    "imagehash>=4.3",
    "numpy>=2.0",
    "opencv-python>=4.9",
    "Pillow>=12.0",
    "PyQt6>=6.6",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
ai = [
    "torch>=2.2",
    "transformers>=4.37",
]

[project.scripts]
photosortx = "main:main"

[tool.setuptools]
packages = ["src", "gui", "modules"]
py-modules = ["main"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
