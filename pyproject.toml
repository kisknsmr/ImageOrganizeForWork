[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photosortx"
version = "2.3.0"
description = "AIを活用した高機能な画像整理・管理アプリケーション"
requires-python = ">=3.10"
dependencies = [
    "imagehash>=4.3",
    "numpy>=2.0",
    "opencv-python>=4.9",
    "Pillow>=12.0",
    "scikit-learn>=1.5",
    # HEIC/HEIF 対応（未導入なら .heic/.heif が対応形式から自動で外れる）
    "pillow-heif>=1.0",
]

[project.optional-dependencies]
ai = [
    "torch>=2.2",
    "transformers>=4.37",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["src", "src.services"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
